name: ephemera CLI

# The CLI pipelines use to deploy previews (cli/, docs/ci-pipeline.md).
# Every change: tests on the oldest and newest supported Python, the package
# and the container image built. A tag cli-vX.Y.Z publishes both: PyPI by
# trusted publishing (no token stored here), the image to GHCR.

on:
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest build
      - run: pytest -q
      - name: Build the package
        run: python -m build
      - name: The installed command runs
        run: |
          pip install dist/*.whl
          ephemera --version
          # No token: a usage error (exit 2) with the fix, not a crash.
          set +e; EPHEMERA_TOKEN= ephemera preview status --id 1; test $? -eq 2
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: dist
          path: cli/dist/

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ephemera-cli cli && docker run --rm ephemera-cli --version
      - name: Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$VERSION" latest; do
            docker tag ephemera-cli "ghcr.io/${{ github.repository_owner }}/ephemera-cli:$tag"
            docker push "ghcr.io/${{ github.repository_owner }}/ephemera-cli:$tag"
          done

  pypi:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/cli-v')
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
