name: Deploy Ephemera to GKE

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
      - 'infrastructure/k8s/ephemera/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - infra
          - app
          - destroy

env:
  GCP_PROJECT_ID: ephemera-dev-2025
  GKE_CLUSTER: ephemera-dev
  GKE_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/ephemera-dev-2025/ephemera

jobs:
  # ──────────────────────────────────────────────
  # TEST — unit tests for the API (runs on PRs and before every deploy)
  # ──────────────────────────────────────────────
  test:
    name: Test API
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: api/requirements-dev.txt

    - name: Install dependencies
      run: pip install -r api/requirements-dev.txt

    - name: Run tests
      run: cd api && python -m pytest -q

  # ──────────────────────────────────────────────
  # DESTROY — tears down all GCP infrastructure
  # ──────────────────────────────────────────────
  destroy:
    name: Destroy Infrastructure
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        cd infrastructure/terraform/gcp
        terraform init -input=false

    - name: Clean up removed modules from state
      run: |
        cd infrastructure/terraform/gcp
        terraform state rm module.kubernetes_secrets 2>/dev/null || true

    - name: Remove load balancers Kubernetes created
      run: |
        # Services of type LoadBalancer (the nginx ingress controller) create
        # GCP forwarding rules, target pools and firewall rules that deleting
        # the cluster does not remove. Left behind they keep billing and can
        # block the VPC deletion, so they go first, and we wait for GCP to
        # release the forwarding rules before Terraform starts.
        if ! gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" \
            --region "${{ env.GKE_REGION }}" --project "${{ env.GCP_PROJECT_ID }}" 2>/dev/null; then
          echo "Cluster not reachable; nothing to clean up in Kubernetes."
          exit 0
        fi
        kubectl get svc -A -o json \
          | jq -r '.items[] | select(.spec.type == "LoadBalancer") | "\(.metadata.namespace) \(.metadata.name)"' \
          | while read -r ns name; do
              echo "Deleting LoadBalancer service $ns/$name"
              kubectl delete svc -n "$ns" "$name" --timeout=3m || true
            done
        for i in $(seq 1 30); do
          remaining=$(gcloud compute forwarding-rules list --project "${{ env.GCP_PROJECT_ID }}" \
            --filter="region:(${{ env.GKE_REGION }})" --format='value(name)' | wc -l)
          [ "$remaining" -eq 0 ] && break
          echo "Waiting for $remaining forwarding rule(s) to be released..."
          sleep 10
        done
        gcloud compute forwarding-rules list --project "${{ env.GCP_PROJECT_ID }}" --format='table(name,region,IPAddress)'

    - name: Terraform Destroy
      run: |
        cd infrastructure/terraform/gcp
        terraform destroy -auto-approve \
          -var="gcp_project_id=${{ env.GCP_PROJECT_ID }}" \
          -var="gcp_region=${{ env.GKE_REGION }}" \
          -var="environment=dev" \
          -var="owner=sabiut" \
          -var="cluster_version=1.34"

    - name: Confirm destruction
      run: |
        echo "All GCP infrastructure has been destroyed."
        echo "To redeploy, trigger this workflow with action=all"

  # ──────────────────────────────────────────────
  # INFRA — provision GCP infrastructure only
  # ──────────────────────────────────────────────
  infra:
    name: Provision Infrastructure
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.action == 'infra' || github.event.inputs.action == 'all')
    runs-on: ubuntu-latest

    outputs:
      static_ip: ${{ steps.get_ip.outputs.static_ip }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        cd infrastructure/terraform/gcp
        terraform init -input=false

    - name: Clean up removed modules from state
      run: |
        cd infrastructure/terraform/gcp
        # Remove kubernetes_secrets module if it exists in state
        # (module was removed — secrets now managed by kubectl in app job)
        terraform state rm module.kubernetes_secrets 2>/dev/null || true

    - name: Terraform Apply
      run: |
        cd infrastructure/terraform/gcp
        terraform apply -auto-approve \
          -var="gcp_project_id=${{ env.GCP_PROJECT_ID }}" \
          -var="gcp_region=${{ env.GKE_REGION }}" \
          -var="environment=dev" \
          -var="owner=sabiut" \
          -var="cluster_version=1.34"

    - name: Get static IP
      id: get_ip
      run: |
        cd infrastructure/terraform/gcp
        STATIC_IP=$(terraform output -raw ingress_ip 2>/dev/null || echo "")
        echo "static_ip=${STATIC_IP}" >> $GITHUB_OUTPUT
        echo "=========================================="
        echo "Infrastructure provisioned successfully!"
        echo "Static IP: ${STATIC_IP}"
        echo "=========================================="
        echo "Update Cloudflare DNS: ephemera-api.devpreview.app -> ${STATIC_IP}"
        echo "Then run the pipeline again with action=app to deploy the application."

  # ──────────────────────────────────────────────
  # APP — build & deploy application to GKE
  # ──────────────────────────────────────────────
  app:
    name: Deploy Application
    needs: [test, infra]
    # Run if tests passed and infra succeeded or was skipped (action=app or push)
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.action == 'app' ||
       github.event.inputs.action == 'all')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # ─── Connect to GKE ─────────────────────────
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          --region ${{ env.GKE_REGION }} \
          --project ${{ env.GCP_PROJECT_ID }}
      env:
        USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

    # ─── Build & Push Docker Images ──────────────
    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build and push images
      run: |
        # One image serves the API, the Celery worker and Celery beat (the
        # manifests override the command), so build it once and tag it three
        # ways rather than building the same Dockerfile three times.
        docker build -f api/Dockerfile -t ephemera-build ./api
        for name in ephemera-api ephemera-celery-worker ephemera-celery-beat; do
          docker tag ephemera-build ${{ env.ARTIFACT_REGISTRY }}/$name:${{ github.sha }}
          docker tag ephemera-build ${{ env.ARTIFACT_REGISTRY }}/$name:latest
          docker push ${{ env.ARTIFACT_REGISTRY }}/$name:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/$name:latest
        done
        docker image inspect ephemera-build --format 'Image size: {{.Size}} bytes' >> $GITHUB_STEP_SUMMARY

    - name: Get infrastructure connection strings from Terraform
      run: |
        cd infrastructure/terraform/gcp
        terraform init -input=false > /dev/null 2>&1

        # Get Redis connection info
        REDIS_HOST=$(terraform output -raw redis_host 2>/dev/null || echo "")
        REDIS_PORT=$(terraform output -raw redis_port 2>/dev/null || echo "")
        REDIS_AUTH=$(terraform output -raw redis_auth_string 2>/dev/null || echo "")

        # Construct Redis URL with authentication and TLS
        REDIS_URL="rediss://:${REDIS_AUTH}@${REDIS_HOST}:${REDIS_PORT}/0"

        # Get PostgreSQL connection info
        DB_HOST=$(terraform output -raw cloudsql_private_ip 2>/dev/null || echo "")
        DB_NAME=$(terraform output -raw cloudsql_database_name 2>/dev/null || echo "")
        DB_USER=$(terraform output -raw cloudsql_username 2>/dev/null || echo "")
        DB_PASSWORD_RAW=$(gcloud secrets versions access latest --secret="ephemera-dev-db-password" --project="${{ env.GCP_PROJECT_ID }}" 2>/dev/null || echo "")

        # URL-encode the password to handle special characters
        DB_PASSWORD=$(DB_PASSWORD_RAW="${DB_PASSWORD_RAW}" python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['DB_PASSWORD_RAW'], safe=''))")

        DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}"

        # Export to GitHub environment
        {
          echo "REDIS_URL<<EOF"
          echo "${REDIS_URL}"
          echo "EOF"
          echo "DATABASE_URL<<EOF"
          echo "${DATABASE_URL}"
          echo "EOF"
        } >> $GITHUB_ENV

    - name: Get static IP from Terraform
      run: |
        cd infrastructure/terraform/gcp
        STATIC_IP=$(terraform output -raw ingress_ip 2>/dev/null || echo "")
        echo "STATIC_IP=${STATIC_IP}" >> $GITHUB_ENV

    # ─── Install Cluster Components ──────────────
    - name: Install nginx-ingress controller
      run: |
        if ! kubectl get namespace ingress-nginx &> /dev/null; then
          echo "Installing nginx-ingress controller with static IP: ${{ env.STATIC_IP }}"
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml

          # Configure LoadBalancer to use static IP
          kubectl patch service ingress-nginx-controller -n ingress-nginx \
            -p '{"spec":{"loadBalancerIP":"${{ env.STATIC_IP }}"}}'

          # Wait for ingress controller to be ready
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

          # The admission webhook is only trusted once these two jobs have
          # generated its certificate and patched the CA into the webhook
          # configuration. Until then every Ingress create fails with
          # "x509: certificate signed by unknown authority".
          kubectl wait --namespace ingress-nginx \
            --for=condition=complete \
            job/ingress-nginx-admission-create job/ingress-nginx-admission-patch \
            --timeout=180s
          echo "Waiting for LoadBalancer IP to be assigned..."
          sleep 30
        else
          echo "nginx-ingress already installed"
          kubectl patch service ingress-nginx-controller -n ingress-nginx \
            -p '{"spec":{"loadBalancerIP":"${{ env.STATIC_IP }}"}}'
        fi

    - name: Install cert-manager
      run: |
        if ! kubectl get namespace cert-manager &> /dev/null; then
          echo "Installing cert-manager..."
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.yaml
          kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager -n cert-manager
          kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-webhook -n cert-manager
          kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-cainjector -n cert-manager
        else
          echo "cert-manager already installed"
        fi

    # ─── Deploy Application ─────────────────────
    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f infrastructure/k8s/ephemera/namespace.yaml
        kubectl apply -f infrastructure/k8s/ephemera/configmap.yaml

        # Create secret from Terraform outputs and GitHub secrets
        kubectl create secret generic ephemera-secrets -n ephemera-system \
          --from-literal=DATABASE_URL="${{ env.DATABASE_URL }}" \
          --from-literal=REDIS_URL="${{ env.REDIS_URL }}" \
          --from-literal=CELERY_BROKER_URL="${{ env.REDIS_URL }}" \
          --from-literal=CELERY_RESULT_BACKEND="${{ env.REDIS_URL }}" \
          --from-literal=GITHUB_APP_ID="${{ secrets.APP_ID }}" \
          --from-literal=GITHUB_APP_CLIENTID="${{ secrets.APP_CLIENT_ID }}" \
          --from-literal=GITHUB_WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
          --from-literal=GITHUB_APP_PRIVATE_KEY="${{ secrets.APP_PRIVATE_KEY }}" \
          --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
          --from-literal=GITHUB_OAUTH_CLIENT_ID="${{ secrets.OAUTH_CLIENT_ID }}" \
          --from-literal=GITHUB_OAUTH_CLIENT_SECRET="${{ secrets.OAUTH_CLIENT_SECRET }}" \
          --from-literal=ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
          --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
          --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
          --from-literal=DEEPSEEK_MODEL="${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}" \
          --from-literal=AI_PROVIDER="${{ vars.AI_PROVIDER || 'anthropic' }}" \
          --dry-run=client -o yaml | kubectl apply -f -

        # Apply Let's Encrypt ClusterIssuer
        export LETSENCRYPT_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}"
        envsubst < infrastructure/k8s/letsencrypt-issuer.yaml.template | kubectl apply -f -

        # Substitute the commit-tagged image before applying so the pods roll
        # exactly once. Applying ":latest" and then "set image" caused two
        # back-to-back rollouts, each pulling a fresh image onto every node.
        for f in api-deployment celery-worker-deployment celery-beat-deployment; do
          sed "s|\(${{ env.ARTIFACT_REGISTRY }}/[a-z-]*\):latest|\1:${{ github.sha }}|" \
            infrastructure/k8s/ephemera/$f.yaml | kubectl apply -f -
        done
        kubectl apply -f infrastructure/k8s/ephemera/api-service.yaml
        # The ingress admission webhook can take a little longer than its
        # jobs to start serving with the patched certificate; retry briefly
        # rather than fail the whole deploy on that race.
        for attempt in $(seq 1 12); do
          if kubectl apply -f infrastructure/k8s/ephemera/api-ingress.yaml; then break; fi
          if [ "$attempt" = 12 ]; then echo "Ingress still rejected after 2 minutes"; exit 1; fi
          echo "Ingress admission webhook not ready yet (attempt $attempt); retrying in 10s"
          sleep 10
        done

    - name: Wait for rollout to complete
      run: |
        # Small preemptible nodes pull the image and start Python slowly;
        # five minutes was not enough even for a healthy rollout.
        for d in ephemera-api ephemera-celery-worker ephemera-celery-beat; do
          kubectl rollout status deployment/$d -n ephemera-system --timeout=10m || {
            echo "Rollout of $d failed. Pod status, events and logs follow."
            kubectl get pods -n ephemera-system -o wide
            kubectl get events -n ephemera-system --sort-by=.lastTimestamp | tail -40
            kubectl describe deployment/$d -n ephemera-system | tail -20
            echo "=== Recent logs ==="
            kubectl logs -n ephemera-system deployment/$d --tail=50 --all-containers=true || true
            exit 1
          }
        done

    - name: Run database migrations
      run: |
        # Runs after the rollout so a Ready pod is guaranteed. On the first
        # GKE deployment the old version of this step waited two minutes for
        # a pod, gave up, and hid the failure behind "|| echo", leaving the
        # database with no tables and every login a 500.
        kubectl exec -n ephemera-system deployment/ephemera-api -- alembic upgrade head
        kubectl exec -n ephemera-system deployment/ephemera-api -- alembic current

    - name: Verify deployment
      run: |
        kubectl get pods -n ephemera-system
        kubectl get ingress -n ephemera-system
        INGRESS_IP=$(kubectl get ingress ephemera-api -n ephemera-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "=========================================="
        echo "Deployment complete!"
        echo "API: https://ephemera-api.devpreview.app"
        echo "Ingress IP: ${INGRESS_IP}"
        echo "=========================================="
        echo "Make sure Cloudflare DNS points to: ${INGRESS_IP}"
