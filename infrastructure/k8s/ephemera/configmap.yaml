apiVersion: v1
kind: ConfigMap
metadata:
  name: ephemera-config
  namespace: ephemera-system
data:
  # Application
  ENVIRONMENT: "production"
  BASE_DOMAIN: "devpreview.app"
  # GitHub logins that see every environment; everyone else sees only their own PRs
  ADMIN_GITHUB_LOGINS: "sabiut"

  # Managed builds (docs/managed-builds.md), in beta: every repository may
  # turn them on ("*"), while one of the build slots is free. The worker
  # builds as the Terraform-created slots in this project (us-central1).
  MANAGED_BUILDS_ENABLED: "true"
  MANAGED_BUILDS_ALLOWLIST: "*"
  GCP_PROJECT_ID: "ephemera-dev-2025"

  # Kubernetes (will use in-cluster config)
  KUBECONFIG_PATH: ""
  CLUSTER_NAME: "ephemera-dev"

  # AWS
  AWS_REGION: "ap-southeast-2"
  AWS_ACCOUNT_ID: "827602717118"
