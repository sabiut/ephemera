apiVersion: v1
kind: ServiceAccount
metadata:
  name: ephemera-worker
  namespace: ephemera-system
  annotations:
    # modules/managed-builds: may start and cancel builds as the build slot
    # accounts, and use the build buckets and slot registries. Nothing else:
    # no IAM administration, no cluster, no Secret Manager.
    iam.gke.io/gcp-service-account: ephemera-builds-controller@ephemera-dev-2025.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemera-celery-worker
  namespace: ephemera-system
  labels:
    app: ephemera
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ephemera
      component: celery-worker
  template:
    metadata:
      labels:
        app: ephemera
        component: celery-worker
    spec:
      # Its own identity: the worker starts managed builds as
      # ephemera-builds-controller (Workload Identity, below). The API and
      # beat keep ephemera-api, which has no Google identity.
      serviceAccountName: ephemera-worker
      containers:
      - name: celery-worker
        image: us-central1-docker.pkg.dev/ephemera-dev-2025/ephemera/ephemera-celery-worker:latest
        imagePullPolicy: Always
        command: ["celery"]
        args:
          - "-A"
          - "app.core.celery_app"
          - "worker"
          - "--loglevel=info"
          - "--queues=environment,cleanup"
          - "--concurrency=4"
        env:
        # Non-sensitive config from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: ENVIRONMENT
        - name: BASE_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: BASE_DOMAIN
        - name: MANAGED_BUILDS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: MANAGED_BUILDS_ENABLED
        - name: MANAGED_BUILDS_ALLOWLIST
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: MANAGED_BUILDS_ALLOWLIST
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: GCP_PROJECT_ID
        - name: KUBECONFIG_PATH
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: KUBECONFIG_PATH
        - name: CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: CLUSTER_NAME
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: AWS_REGION
        - name: AWS_ACCOUNT_ID
          valueFrom:
            configMapKeyRef:
              name: ephemera-config
              key: AWS_ACCOUNT_ID
        # Sensitive config from Secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: REDIS_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: CELERY_RESULT_BACKEND
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: GITHUB_APP_ID
        - name: GITHUB_APP_CLIENTID
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: GITHUB_APP_CLIENTID
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: GITHUB_WEBHOOK_SECRET
        - name: GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: GITHUB_APP_PRIVATE_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: SECRET_KEY
        # Decrypts the repositories' registry tokens into each preview's
        # pull Secret (private images).
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: ENCRYPTION_KEY
        # The dashboard's address, for the links in PR comments and statuses.
        - name: GITHUB_OAUTH_REDIRECT_URI
          value: "https://ephemera-api.devpreview.app/auth/github/callback"
        # AI Deployment config
        - name: AI_PROVIDER
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: AI_PROVIDER
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: ANTHROPIC_API_KEY
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: DEEPSEEK_API_KEY
              optional: true
        - name: DEEPSEEK_MODEL
          valueFrom:
            secretKeyRef:
              name: ephemera-secrets
              key: DEEPSEEK_MODEL
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
